; Ajustes de Alien Shooter Widescreen Fix. Copia este archivo y d3d9.dll a la carpeta del juego.
; El lanzador escribe este archivo por ti; solo hace falta editarlo a mano si no usas el lanzador.
[upscale]
; 1 = activado, 0 = el juego funciona como el original
Enabled=1
; Pantalla donde se abre el juego, por ejemplo \\.\DISPLAY2 (vacio = la principal)
Monitor=
; Resolucion de pantalla. 0 = la del escritorio (ventana sin bordes a pantalla completa)
OutputWidth=0
OutputHeight=0
; Resolucion interna del juego. 1720x720 = mitad exacta de 3440x1440; 1920x1080 = mitad de 4K.
; No pases de 2000 de ancho: los niveles 1 y 11 miden 2000 px.
RenderWidth=1720
RenderHeight=720
; 0 = pixeles nitidos, 1 = suavizado
LinearFilter=0
; 1 = solo escalas enteras (x2, x3...)
IntegerScale=0
; 1 = el raton no sale de la pantalla del juego mientras juegas
ClipCursor=1
; Solo para pruebas automaticas: ventana fuera de pantalla
TestMode=0
Log=1
